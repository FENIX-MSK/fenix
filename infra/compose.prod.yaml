# Production stack on the VPS. Secrets come from /opt/fenix/.env (see infra/README.md).
name: fenix

x-backend: &backend
  image: ghcr.io/fenix-msk/fenix-api:${IMAGE_TAG:-latest}
  env_file: .env
  environment:
    ENVIRONMENT: production
    DATABASE_URL: postgresql+asyncpg://fenix:${POSTGRES_PASSWORD}@postgres:5432/fenix
    REDIS_URL: redis://redis:6379/0
    # The VPS cannot reach Telegram directly; Bot API calls go through the tunnel.
    TELEGRAM_PROXY_URL: socks5://tg-egress:1080
  restart: unless-stopped
  networks: [app]

services:
  caddy:
    image: ghcr.io/fenix-msk/fenix-web:${IMAGE_TAG:-latest}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports: ["80:80", "443:443"]
    volumes: [caddy-data:/data, caddy-config:/config]
    depends_on: [api]
    restart: unless-stopped
    networks: [app, monitoring]

  migrate:
    <<: *backend
    # Initial data is idempotent: it only fills what does not exist yet.
    command: ["sh", "-c", "alembic upgrade head && fenix-seed"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  # Telegram updates are consumed only by the "bot" service (long polling, AD-8).
  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      retries: 5
    networks: [app, monitoring]

  worker:
    <<: *backend
    command: ["taskiq", "worker", "fenix.worker:broker"]
    depends_on: [redis, postgres]

  bot:
    <<: *backend
    command: ["fenix-bot-polling"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      tg-egress: { condition: service_healthy }

  tg-egress:
    image: ghcr.io/fenix-msk/fenix-tg-egress:${IMAGE_TAG:-latest}
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    volumes:
      - ./tg-egress/awg0.conf:/etc/amnezia/amneziawg/awg0.conf:ro
    restart: unless-stopped
    networks: [app]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fenix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fenix
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fenix"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    networks: [app]

  redis:
    image: redis:8-alpine
    volumes: [redis-data:/data]
    restart: unless-stopped
    networks: [app]

  minio:
    # MinIO stopped publishing images (Docker Hub / quay.io deny pulls); this tag
    # must be preloaded with `docker load`. Replacement is an open decision.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: missing
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["127.0.0.1:9001:9001"]  # console via SSH tunnel only
    volumes: [minio-data:/data]
    restart: unless-stopped
    networks: [app]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks: [monitoring]

  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./monitoring/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
    networks: [monitoring]

  alloy:
    image: grafana/alloy:v1.10.0
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks: [monitoring]

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${SITE_DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks: [monitoring]

networks:
  app:
  monitoring:

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  loki-data:
  grafana-data:
