# Single-node Garage (AD-12). Secrets come from the environment:
# GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN. Layout, bucket and key are created by
# `fenix-seed` through the admin API, so a fresh volume needs no manual setup.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage"

# Public read of the media bucket: Caddy proxies /media/* here with "Host: media".
[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage"

[admin]
api_bind_addr = "[::]:3903"
