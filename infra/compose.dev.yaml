# Local dependencies only; run the API, bot and webapp on the host.
# docker compose -f infra/compose.dev.yaml up -d
name: fenix-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fenix
      POSTGRES_PASSWORD: fenix
      POSTGRES_DB: fenix
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fenix"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:6379:6379"]

  minio:
    # MinIO stopped publishing images (Docker Hub / quay.io deny pulls); this tag
    # must be preloaded with `docker load`. Replacement is an open decision.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: missing
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: fenix
      MINIO_ROOT_PASSWORD: fenix-dev-secret
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio-data:/data]

volumes:
  postgres-data:
  minio-data:
