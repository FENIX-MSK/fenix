name: Deploy

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/fenix-msk
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/fenix-api:${{ env.IMAGE_TAG }},${{ env.IMAGE_PREFIX }}/fenix-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push web (Caddy + Mini App)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: webapp/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/fenix-web:${{ env.IMAGE_TAG }},${{ env.IMAGE_PREFIX }}/fenix-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push Telegram egress tunnel
        uses: docker/build-push-action@v6
        with:
          context: infra/tg-egress
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/fenix-tg-egress:${{ env.IMAGE_TAG }},${{ env.IMAGE_PREFIX }}/fenix-tg-egress:latest
          cache-from: type=gha,scope=tg-egress
          cache-to: type=gha,mode=max,scope=tg-egress

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload stack definition
        run: |
          rsync -az --delete --exclude .env --exclude .env.example --exclude tg-egress \
            infra/compose.prod.yaml infra/monitoring infra/garage \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/fenix/"
      - name: Roll out
        env:
          # Public addresses live in the `production` environment variables, so moving
          # to another domain is a variable change plus a deploy.
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          WEBAPP_URL: ${{ vars.WEBAPP_URL }}
          BOOTSTRAP_STAFF_TELEGRAM_USERNAME: ${{ vars.BOOTSTRAP_STAFF_TELEGRAM_USERNAME }}
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<SCRIPT
          set -euo pipefail
          cd /opt/fenix
          set_env() {
            if grep -q "^\$1=" .env; then sed -i "s|^\$1=.*|\$1=\$2|" .env; else echo "\$1=\$2" >> .env; fi
          }
          [ -n "${SITE_ADDRESS}" ] && set_env SITE_ADDRESS '"${SITE_ADDRESS}"'
          [ -n "${SITE_DOMAIN}" ] && set_env SITE_DOMAIN "${SITE_DOMAIN}"
          [ -n "${WEBAPP_URL}" ] && set_env WEBAPP_URL "${WEBAPP_URL}"
          [ -n "${BOOTSTRAP_STAFF_TELEGRAM_USERNAME}" ] && set_env BOOTSTRAP_STAFF_TELEGRAM_USERNAME "${BOOTSTRAP_STAFF_TELEGRAM_USERNAME}"
          # Secrets that only this server needs: generated once, kept afterwards.
          ensure_secret() { grep -q "^\$1=." .env || set_env "\$1" "\$2"; }
          ensure_secret GARAGE_RPC_SECRET "\$(openssl rand -hex 32)"
          ensure_secret GARAGE_ADMIN_TOKEN "\$(openssl rand -hex 24)"
          ensure_secret S3_ACCESS_KEY_ID "GK\$(openssl rand -hex 12)"
          ensure_secret S3_SECRET_ACCESS_KEY "\$(openssl rand -hex 32)"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
          docker compose -f compose.prod.yaml pull
          docker compose -f compose.prod.yaml up -d --remove-orphans
          # MinIO was replaced by Garage (story 2.5); its data was never used.
          docker volume rm fenix_minio-data 2>/dev/null || true
          docker logout ghcr.io
          docker image prune -f
          SCRIPT

      - name: Smoke test the stand
        env:
          WEBAPP_URL: ${{ vars.WEBAPP_URL }}
        run: |
          # `exec -T` reads stdin: without </dev/null it would swallow the rest of the
          # heredoc and the smoke test would silently never run.
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s > smoke.log <<SCRIPT
          set -euo pipefail
          cd /opt/fenix
          for attempt in \$(seq 1 30); do
            if docker compose -f compose.prod.yaml exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)" </dev/null 2>/dev/null; then break; fi
            sleep 5
          done
          # Through the public URL: Caddy, TLS, API and database together.
          docker compose -f compose.prod.yaml exec -T api fenix-smoke "${WEBAPP_URL}" </dev/null
          docker compose -f compose.prod.yaml ps --format "{{.Service}} {{.State}} {{.Status}}" </dev/null
          echo "smoke: finished"
          SCRIPT
          cat smoke.log
          grep -q "^smoke: finished$" smoke.log
          ! grep -q "^FAIL" smoke.log
