name: Deploy

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/fenix-msk
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/fenix-api:${{ env.IMAGE_TAG }},${{ env.IMAGE_PREFIX }}/fenix-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push web (Caddy + Mini App)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: webapp/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/fenix-web:${{ env.IMAGE_TAG }},${{ env.IMAGE_PREFIX }}/fenix-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push Telegram egress tunnel
        uses: docker/build-push-action@v6
        with:
          context: infra/tg-egress
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/fenix-tg-egress:${{ env.IMAGE_TAG }},${{ env.IMAGE_PREFIX }}/fenix-tg-egress:latest
          cache-from: type=gha,scope=tg-egress
          cache-to: type=gha,mode=max,scope=tg-egress

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload stack definition
        run: |
          rsync -az --delete --exclude .env --exclude .env.example --exclude tg-egress \
            infra/compose.prod.yaml infra/monitoring \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/fenix/"
      - name: Roll out
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<SCRIPT
          set -euo pipefail
          cd /opt/fenix
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
          # MinIO images are no longer published; that one is preloaded on the server.
          # A truly missing image still fails at "up".
          docker compose -f compose.prod.yaml pull --ignore-pull-failures
          docker compose -f compose.prod.yaml up -d --remove-orphans
          docker logout ghcr.io
          docker image prune -f
          SCRIPT
