name: CI

on:
  pull_request:
    branches: [develop, release]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fenix
          POSTGRES_PASSWORD: fenix
          POSTGRES_DB: fenix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fenix"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    env:
      TELEGRAM_BOT_TOKEN: "123456:CI-TOKEN"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest
      - name: Migrations match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      # The API client is generated from the backend's OpenAPI schema.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
        working-directory: backend
      - run: npm ci
      - name: Generated API client is up to date
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose files
        working-directory: infra
        run: |
          sed 's/=$/=ci/' .env.example > .env
          docker compose -f compose.prod.yaml config -q
          docker compose -f compose.dev.yaml config -q
